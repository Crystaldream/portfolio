<form 
    id="contact-form"
    class="contact-form"
    hx-post="/htmx/contact/submit"
    hx-target="#form-result"
    hx-swap="innerHTML"
>
    <!-- Honeypot field -->
    <div class="form-group" style="display:none" aria-hidden="true">
        <label for="website">Website</label>
        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
    </div>
    
    <div class="form-group">
        <label for="name" class="form-label">Name</label>
        <input type="text" id="name" name="name" class="form-input" required>
    </div>
    
    <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" name="email" class="form-input" required>
    </div>
    
    <div class="form-group">
        <label for="subject" class="form-label">Subject</label>
        <input type="text" id="subject" name="subject" class="form-input" required>
    </div>
    
    <div class="form-group">
        <label for="message" class="form-label">Message</label>
        <textarea id="message" name="message" class="form-textarea" required minlength="10" maxlength="5000" rows="6"></textarea>
    </div>
    
    <button type="submit" class="button button--primary">
        <span class="button__text">Send Message</span>
        <svg class="icon" aria-hidden="true"><use href="/static/icons/icons.svg#icon-paper-plane"></use></svg>
    </button>
    
    <div id="form-result"></div>
</form>
